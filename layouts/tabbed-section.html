{{ define "title" }}
  {{- .Title }} · {{ site.Title -}}
{{ end }}
{{ define "content" }}
    <div class="page-container zigzag">
        <main class="content">
            <div class="post brick">
                <div class="container">
                    {{- $tabs := .CurrentSection.Pages -}}
                    {{- partial "tabs/page-frame.html" (dict "tabs" $tabs) -}}
              </div>
          </div>
      </main>
    </div>
{{ end }}
