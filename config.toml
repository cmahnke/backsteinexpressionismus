baseURL = "https://backsteinexpressionismus.projektemacher.org/"
title = "Backsteinexpressionismus"
publishDir = "docs"
canonifyURLs = true
locale = "de"
defaultContentLanguage = "de"
rssLimit = 25
#Paginate = 20
disablePathToLower = true
theme = ["projektemacher-base"]
copyright = '<a href="https://projektemacher.org/" target="_blank">Projektemacher</a>'
#preserveTaxonomyNames = true
timeout = "120s"
enableGitInfo = true

[pagination]
  pagerSize = 20

[languages]
  [languages.de]
    label = "Deutsch"

    [languages.de.menu]
      [[languages.de.menu.main]]
        name = "Start"
        url = "/"
        weight = 1

      [[languages.de.menu.main]]
        name = "Übersichten"
        url = "/lists"
        weight = 1

      [[languages.de.menu.main]]
        name = "Links"
        url = "/links"
        weight = 2

      [[languages.de.menu.main]]
        name = "Suche"
        url = "/search"
        weight = 3

      [[languages.de.menu.main]]
        name = "Über"
        url = "/about"
        weight = 4

  [languages.en]
    label = "English"

    [languages.en.params]
      description = "Historic depictions of Brick Expressionism buildings from books and postcards."

    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        url = "/"
        weight = 1

      [[languages.en.menu.main]]
        name = "Overviews"
        url = "lists"
        weight = 1

      [[languages.en.menu.main]]
        name = "Links"
        url = "links"
        weight = 2

      [[languages.en.menu.main]]
        name = "Search"
        url = "search"
        weight = 3

      [[languages.en.menu.main]]
        name = "About"
        url = "about"
        weight = 4

[module]
  [[module.mounts]]
    source = "assets/scss"
    target = "assets/scss"

  [[module.mounts]]
    source = "assets/js"
    target = "assets/js"

  [[module.mounts]]
    source = "assets/ts"
    target = "assets/ts"

  [[module.mounts]]
    source = "static"
    target = "static"

  [[module.mounts]]
    source = "node_modules/tify/dist/"
    target = "static/tify"

  [[module.mounts]]
      source = "node_modules/@pagefind/modular-ui/css/"
      target = "assets/scss/pagefind"

  [[module.mounts]]
      source = "node_modules/@pagefind/default-ui"
      target = "assets/js/pagefind"

[mediaTypes]
  [mediaTypes."application/ld+json"]
    suffixes = ["json"]
  [mediaTypes."application/json"]
    suffixes = ["geojson", "gjson"]
  # See https://www.loc.gov/preservation/digital/formats/fdd/fdd000538.shtml
  [mediaTypes."image/jxl"]
    suffixes = ["jxl"]

[outputFormats]
  [outputFormats.geojson]
    mediaType = "application/json"
    isPlainText = true
    isHTML = false
    baseName = "map"
    notAlternative = true

  [outputFormats.iiif-manifest]
    mediaType = "application/ld+json"
    isPlainText = true
    isHTML = false
    baseName = "manifest"
    notAlternative = true

  [outputFormats.iiif-collection]
    mediaType = "application/ld+json"
    isPlainText = true
    isHTML = false
    baseName = "collection"
    notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe= true

[imaging]
  [imaging.jpeg]
    quality = 95
  [imaging.webp]
    quality = 95

[taxonomies]
  tag = "tags"

[sitemap]
  changeFreq = 'weekly'

[build]
  writeStats = true

[outputs]
  home = ["html", "rss", "iiif-collection"]

[[cascade]]
  outputs = ['html','rss', 'iiif-collection']
  [cascade.target]
    kind = "term"
    path = "/tags/**"

[security]
  [security.http]
    mediaTypes = ['^application/json$', '^application/json;\s?charset=[uU][tT][fF]-8$', '^application/sparql-results\+json;\s?charset=[uU][tT][fF]-8$']

[params.js]
  format = "esm"
