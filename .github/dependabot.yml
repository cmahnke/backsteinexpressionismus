version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
        - '*'
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm:
        patterns:
        - '*'
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      exclude:
        - projektemacher-base

  - package-ecosystem: "npm"
    directory: "/Source Files/Mocks/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-mocks:
        patterns:
        - '*'

  - package-ecosystem: "pip"
    directory: "/Source Files/Mocks/"
    schedule:
      interval: "weekly"
    groups:
      pip-mocks:
        patterns:
        - '*'
